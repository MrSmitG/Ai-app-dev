appId: com.localmod.app
productName: Localmod
copyright: Copyright © Localmod
# Built from repo root: npm run build:win / build:mac / build:linux
directories:
  output: release
  buildResources: apps/desktop/build
files:
  - apps/desktop/dist/client/**/*
  - apps/desktop/electron/**/*
  - apps/desktop/package.json
  - package.json
  - "!**/node_modules/**"
extraMetadata:
  main: apps/desktop/electron/main.cjs
  dependencies: {}
npmRebuild: false
nodeGypRebuild: false
extraResources:
  - from: build/engine-pack
    to: engine
  - from: build/suite-pack
    to: suite
asar: true
electronFuses:
  runAsNode: true
  enableNodeCliInspectArguments: true
icon: apps/desktop/build/icon.png
win:
  target:
    - nsis
    - portable
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  artifactName: Localmod.${ext}
  identity: null
linux:
  target:
    - AppImage
  category: Development
  artifactName: Localmod.${ext}
nsis:
  oneClick: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Localmod
  uninstallDisplayName: Localmod
  artifactName: Localmod-Setup.exe
  include: installer.nsh
portable:
  artifactName: Localmod.exe
publish:
  provider: github
  releaseType: release
