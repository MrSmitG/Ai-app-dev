[package]
name = "localmod-desktop"
version = "0.1.0"
description = "Localmod Tauri shell"
edition = "2021"

[lib]
name = "localmod_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
localmod-core = { path = "../../../crates/core" }
